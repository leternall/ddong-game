<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>랭킹</title>
<link rel="stylesheet" href="rankings.css?v=2">
</head>
<body>
  <a id="homeLink" href="index.html">← 허브로</a>

  <div id="rank-container">
    <h1 id="rankTitle">🏆 랭킹</h1>

    <div id="carousel">
      <button id="prevBtn" class="nav-btn" aria-label="이전 게임">◀</button>

      <div id="slide">
        <div id="slideNumber">0001</div>
        <div id="slideTitle">똥피하기</div>
        <div id="rankBody">
          <ol id="rankList"></ol>
          <p id="rankEmpty" class="hidden">아직 기록이 없어요</p>
        </div>
      </div>

      <button id="nextBtn" class="nav-btn" aria-label="다음 게임">▶</button>
    </div>

    <div id="dots"></div>

    <p class="hint">← → 방향키 또는 화면을 좌우로 밀어서 게임을 고르세요</p>
  </div>

  <script src="rankings.js?v=2"></script>

</html>
