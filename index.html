<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>쭈채 게임 모음</title>
<link rel="stylesheet" href="hub.css?v=9">
</head>
<body>
  <div id="pullRefresh"><span class="spin-icon">⟳</span><span id="pullRefreshText">아래로 당겨서 새로고침</span></div>
  <div id="hub-container">
    <h1 id="hub-title">🎮 쭈채 게임 모음</h1>

    <div id="carousel">
      <button id="prevBtn" class="nav-btn" aria-label="이전 게임">◀</button>

      <div id="slide">
        <div id="slideNumber">0001</div>
        <div id="thumbWrap">
          <img id="thumbImg" class="hidden" alt="">
          <div id="thumbFallback" class="hidden"></div>
        </div>
        <div id="slideTitle">똥피하기</div>
        <div id="slideDesc"></div>
      </div>

      <button id="nextBtn" class="nav-btn" aria-label="다음 게임">▶</button>
    </div>

    <div id="dots"></div>

    <button id="startBtn">시작하기</button>

    <p class="hint">← → 방향키 또는 화면을 좌우로 밀어서 게임을 고르세요</p>
  </div>

  <script src="hub.js?v=15"></script>
</body>
</html>
