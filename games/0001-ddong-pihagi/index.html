<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>똥피하기</title>
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="hidden">
      <div id="hud-left">
        <div id="score">점수: 0</div>
        <div id="level">레벨: 1</div>
      </div>
      <div id="lives"></div>
    </div>

    <div id="select-screen" class="overlay">
      <a id="homeLink" href="../../index.html">← 허브로</a>
      <h1>💩 똥피하기 💩</h1>
      <p>캐릭터를 선택하세요</p>
      <div id="character-list"></div>
      <p class="hint">← → 방향키 또는 아래쪽 검은 띠에서 손가락을 좌우로 밀어 이동 · 똥을 3번 맞으면 게임 종료</p>
    </div>

    <div id="pause-screen" class="overlay hidden">
      <h1>일시정지</h1>
      <button id="pauseContinueBtn">계속</button>
      <button id="pauseRestartBtn">재시작</button>
      <button id="pauseSelectBtn">캐릭터 다시 선택</button>
    </div>

    <div id="gameover-screen" class="overlay hidden">
      <img id="gameoverHitImg" class="hidden" alt="">
      <h1>게임 오버!</h1>
      <p id="finalScore">점수: 0</p>
      <p id="rankMessage"></p>
      <div id="nameEntry">
        <input id="nameInput" type="text" placeholder="이름(선택, 최대 3자)" maxlength="3" autocomplete="off">
        <button id="nameSubmitBtn">등록</button>
        <button id="nameSkipBtn">건너뛰기</button>
      </div>
      <p id="nameSavedMsg" class="hidden"></p>
      <div id="rankingList"></div>
      <button id="restartBtn">다시 하기</button>
    </div>

    <div id="levelup-toast" class="hidden"></div>
  </div>

  <script src="../../cloud-ranking.js?v=1"></script>
  <script src="game.js?v=24"></script>
</body>
</html>
