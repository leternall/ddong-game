<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>쭈채Run</title>
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="hidden">
      <div id="hud-left">
        <div id="score">점수: 0</div>
        <div id="distance">레벨 1 · 0m / 100m</div>
      </div>
      <div id="lives"></div>
    </div>

    <div id="controls" class="hidden">
      <button id="leftBtn" aria-label="왼쪽 이동">◀</button>
      <div id="jumpSlot">
        <button id="jumpBtn" aria-label="점프">점프</button>
      </div>
      <button id="rightBtn" aria-label="오른쪽 이동">▶</button>
    </div>

    <div id="select-screen" class="overlay">
      <a id="homeLink" href="../../index.html">← 허브로</a>
      <h1>🏃 쭈채Run 🏃</h1>
      <p>캐릭터를 선택하세요</p>
      <div id="character-list"></div>
      <p class="hint">
        ◀ ▶ 버튼으로 세 줄(왼쪽·가운데·오른쪽) 사이를 이동하고, 점프 버튼으로 구덩이를 뛰어넘으세요.<br>
        나무·바위는 옆줄로 피하고, 고기를 먹으면 +10점 · 100m마다 레벨업하며 점점 빨라집니다!
      </p>
    </div>

    <div id="pause-screen" class="overlay hidden">
      <h1>일시정지</h1>
      <button id="pauseContinueBtn">계속</button>
      <button id="pauseRestartBtn">재시작</button>
      <button id="pauseSelectBtn">캐릭터 다시 선택</button>
    </div>

    <div id="gameover-screen" class="overlay hidden">
      <img id="gameoverHitImg" class="hidden" alt="">
      <h1 id="gameoverTitle">게임 오버!</h1>
      <p id="finalScore">점수: 0</p>
      <p id="rankMessage"></p>
      <div id="nameEntry">
        <input id="nameInput" type="text" placeholder="이름(선택, 최대 3자)" maxlength="3" autocomplete="off">
        <button id="nameSubmitBtn">등록</button>
      </div>
      <p id="nameSavedMsg" class="hidden"></p>
      <div id="rankingList"></div>
      <button id="restartBtn">다시 하기</button>
    </div>

    <div id="levelup-toast" class="hidden"></div>
  </div>

  <script src="game.js?v=13"></script>
</body>
</html>
